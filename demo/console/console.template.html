<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Veto console</title>
<meta name="description" content="A read-only evidence console: pins, receipts, the plan and the counts, every value from a committed artifact.">
<meta name="ui-states" content="verifying,pins,refused,rebased,unreachable,clean,runs,loading,empty,error">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Hallmark · pre-emit critique: P4 H4 E4 S4 R5 V3
   genre: modern-minimal · theme: Cobalt (cool paper, one cobalt signal, hairlines, mono readouts) · macrostructure: Workbench
   audience = the judge as verifier · use = inspect one refusal and its basis · tone = technical (inferred from the handoff, stated not asked)
   deviation from Cobalt, on purpose: the recording is dark, so the dark scheme is the default and the light scheme is the theme's own paper. Both are designed. */
:root {
  --font-display: "Space Grotesk", ui-sans-serif, system-ui, sans-serif;
  --font-body: "Inter", ui-sans-serif, system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --color-paper: oklch(98.5% 0.004 250);
  --color-paper-2: oklch(96% 0.006 250);
  --color-ink: oklch(22% 0.02 258);
  --color-ink-2: oklch(36% 0.018 257);
  --color-ink-3: oklch(45% 0.016 257);
  --color-rule: oklch(88% 0.008 250);
  --color-rule-2: oklch(80% 0.01 250);
  --color-accent: oklch(50% 0.20 256);
  --color-accent-ink: oklch(99% 0 0);
  --color-accent-soft: oklch(50% 0.20 256 / 0.12);
  --color-refuse: oklch(48% 0.19 27);
  --color-refuse-soft: oklch(48% 0.19 27 / 0.12);
  --color-ok: oklch(46% 0.15 150);
  --color-ok-soft: oklch(46% 0.15 150 / 0.14);
  --color-hold: oklch(52% 0.16 70);
  --color-hold-soft: oklch(52% 0.16 70 / 0.16);
  --color-focus: oklch(50% 0.20 256);
  --size-1: 0.75rem; --size-2: 0.875rem; --size-3: 1rem; --size-4: 1.25rem; --size-5: 1.75rem; --size-6: 2.5rem;
  --space-1: 8px; --space-2: 8px; --space-3: 16px; --space-4: 16px; --space-5: 24px; --space-6: 32px; --space-7: 48px;
  --radius-1: 6px; --radius-2: 10px;
  --motion: 160ms cubic-bezier(0.16, 1, 0.3, 1);
  color-scheme: light;
}
:root[data-theme="dark"], :root:not([data-theme="light"]) {
  --color-paper: oklch(20% 0.016 260);
  --color-paper-2: oklch(23% 0.018 260);
  --color-ink: oklch(97% 0.006 250);
  --color-ink-2: oklch(84% 0.01 250);
  --color-ink-3: oklch(68% 0.012 252);
  --color-rule: oklch(32% 0.016 260);
  --color-rule-2: oklch(40% 0.018 260);
  --color-accent: oklch(72% 0.17 256);
  --color-accent-ink: oklch(18% 0.02 260);
  --color-accent-soft: oklch(72% 0.17 256 / 0.16);
  --color-refuse: oklch(70% 0.19 27);
  --color-refuse-soft: oklch(70% 0.19 27 / 0.16);
  --color-ok: oklch(76% 0.16 150);
  --color-ok-soft: oklch(76% 0.16 150 / 0.16);
  --color-hold: oklch(80% 0.15 70);
  --color-hold-soft: oklch(80% 0.15 70 / 0.18);
  --color-focus: oklch(78% 0.16 256);
  color-scheme: dark;
}
:root[data-theme="light"] { color-scheme: light; }
*, *::before, *::after { box-sizing: border-box; }
html, body { overflow-x: clip; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--color-paper); color: var(--color-ink-2); font: 400 var(--size-3)/1.5 var(--font-body); }
h1, h2, h3 { font-family: var(--font-display); font-weight: 600; letter-spacing: -0.02em; color: var(--color-ink); margin: 0; text-wrap: balance; font-style: normal; }
h1 { font-size: var(--size-5); line-height: 1.15; }
h2 { font-size: var(--size-4); line-height: 1.25; }
h3 { font-size: var(--size-3); line-height: 1.3; }
p { margin: 0; max-width: 65ch; }
a { color: var(--color-ink); text-decoration: underline; text-decoration-color: var(--color-rule-2); text-underline-offset: 3px; transition: text-decoration-color var(--motion); }
a:hover { text-decoration-color: var(--color-accent); }
:focus-visible { outline: 2px solid var(--color-focus); outline-offset: 2px; border-radius: var(--radius-1); }
.mono { font-family: var(--font-mono); }
.eyebrow { font: 500 var(--size-1)/1 var(--font-mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--color-ink-3); }
.eyebrow b { color: var(--color-accent); font-weight: 500; }
/* nav: full-width bar, one hairline, wordmark left, frame links, ⌘K right */
.nav { position: sticky; top: 0; z-index: 3; display: flex; align-items: center; gap: var(--space-4); padding: var(--space-3) var(--space-5); border-bottom: 1px solid var(--color-rule); background: color-mix(in oklch, var(--color-paper) 88%, transparent); backdrop-filter: blur(8px); min-height: 56px; }
.wordmark { font: 600 var(--size-4)/1 var(--font-display); color: var(--color-ink); letter-spacing: -0.02em; text-decoration: none; display: inline-flex; align-items: center; gap: var(--space-2); border-bottom: 2px solid transparent; transition: border-color var(--motion); }
.wordmark:hover { border-bottom-color: var(--color-accent); text-decoration: underline; text-decoration-color: var(--color-accent); text-underline-offset: 4px; }
.wordmark i { width: 10px; height: 10px; border-radius: 2px; background: var(--color-accent); display: inline-block; }
.frames { display: flex; gap: var(--space-1); margin-inline-start: var(--space-4); overflow-x: auto; scrollbar-width: none; }
.frames a { font: 500 var(--size-2)/1 var(--font-body); color: var(--color-ink-3); text-decoration: none; padding: var(--space-2) var(--space-3); border-radius: var(--radius-1); border: 1px solid transparent; white-space: nowrap; min-height: 32px; display: inline-flex; align-items: center; transition: color var(--motion), border-color var(--motion), background var(--motion), transform var(--motion); }
.frames a:hover { color: var(--color-ink); border-color: var(--color-rule-2); transform: translateY(-1px); text-decoration: underline; text-underline-offset: 4px; text-decoration-color: var(--color-accent); }
.frames a[aria-current="page"] { color: var(--color-accent); border-color: var(--color-rule-2); background: var(--color-paper-2); }
.nav .right { margin-inline-start: auto; display: flex; gap: var(--space-2); align-items: center; }
.kbd-btn { font: 500 var(--size-1)/1 var(--font-mono); letter-spacing: 0.04em; color: var(--color-ink-2); background: var(--color-paper); border: 1px solid var(--color-rule-2); border-radius: var(--radius-1); padding: 0 var(--space-3); min-height: 32px; min-width: 44px; cursor: pointer; transition: border-color var(--motion), color var(--motion); }
.kbd-btn:hover { border-color: var(--color-accent); color: var(--color-ink); transform: translateY(-1px); box-shadow: 0 1px 0 var(--color-accent); }
.kbd-btn:active { transform: translateY(1px); }
main { padding: var(--space-5); max-width: 1440px; margin: 0 auto; }
.head { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: var(--space-4); align-items: end; margin-bottom: var(--space-5); }
.head .pills { display: flex; gap: var(--space-2); flex-wrap: wrap; }
.pill { font: 500 var(--size-1)/1 var(--font-mono); letter-spacing: 0.06em; text-transform: uppercase; padding: 8px 8px; border-radius: var(--radius-1); border: 1px solid var(--color-rule-2); color: var(--color-ink-2); background: var(--color-paper-2); display: inline-flex; align-items: center; gap: 8px; min-height: 32px; }
.pill i { width: 7px; height: 7px; border-radius: 50%; background: currentColor; display: inline-block; }
.pill.gate { border-width: 2px; }
.pill.refused { color: var(--color-refuse); border-color: var(--color-refuse); background: var(--color-refuse-soft); }
.pill.clean, .pill.rebased { color: var(--color-ok); border-color: var(--color-ok); background: var(--color-ok-soft); }
.pill.verifying { color: var(--color-accent); border-color: var(--color-accent); background: var(--color-accent-soft); }
.pill.mock { color: var(--color-hold); border-color: var(--color-hold); background: var(--color-hold-soft); }
.pill.live { color: var(--color-ok); }
.grid { display: grid; gap: var(--space-4); grid-template-columns: repeat(12, minmax(0, 1fr)); }
.card { border: 1px solid var(--color-rule); border-radius: var(--radius-2); padding: var(--space-5); background: var(--color-paper); min-width: 0; }
.card.graphite { background: var(--color-paper-2); }
.span-3 { grid-column: span 3; } .span-4 { grid-column: span 4; } .span-5 { grid-column: span 5; } .span-7 { grid-column: span 7; } .span-8 { grid-column: span 8; } .span-12 { grid-column: span 12; }
.metric .n { font: 600 var(--size-6)/1 var(--font-display); letter-spacing: -0.03em; color: var(--color-ink); margin: var(--space-2) 0; }
.metric .n.accent { color: var(--color-accent); } .metric .n.ok { color: var(--color-ok); } .metric .n.refuse { color: var(--color-refuse); }
.metric .sub { font-size: var(--size-2); color: var(--color-ink-3); }
table { width: 100%; border-collapse: collapse; font-size: var(--size-2); }
th { text-align: left; font: 500 var(--size-1)/1 var(--font-mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--color-ink-3); padding: var(--space-2) var(--space-2) var(--space-3); border-bottom: 1px solid var(--color-rule); }
td { padding: 8px var(--space-2); border-bottom: 1px solid var(--color-rule); vertical-align: top; overflow-wrap: anywhere; }
tr:last-child td { border-bottom: 0; }
td.mono, .code { font-family: var(--font-mono); font-size: var(--size-1); color: var(--color-ink-3); }
tr.repin td:first-child { box-shadow: inset 3px 0 0 var(--color-hold); }
.dl { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: var(--space-1) var(--space-4); font-family: var(--font-mono); font-size: var(--size-1); }
.dl dt { color: var(--color-ink-3); } .dl dd { margin: 0; color: var(--color-ink-2); overflow-wrap: anywhere; }
.was { text-decoration: line-through; color: var(--color-ink-3); }
.now { color: var(--color-refuse); font-weight: 500; }
.tag { font: 500 var(--size-1)/1 var(--font-mono); letter-spacing: 0.04em; }
.tag.unforced { color: var(--color-ok); } .tag.injected { color: var(--color-hold); }
.fact { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: var(--space-2) var(--space-4); padding: var(--space-2) 0; border-top: 1px solid var(--color-rule); }
.fact:first-of-type { border-top: 0; }
.why { border-left: 2px solid var(--color-accent); padding-left: var(--space-3); font-size: var(--size-2); color: var(--color-ink-2); margin-top: var(--space-3); }
.tl { list-style: none; margin: 0; padding: 0; }
.tl li { display: grid; grid-template-columns: 16px 88px minmax(0, 1fr) auto; gap: var(--space-3); align-items: baseline; padding: 8px 0; border-bottom: 1px solid var(--color-rule); font-size: var(--size-2); }
.tl li:last-child { border-bottom: 0; }
.tl .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--color-ok); align-self: center; } .tl .dot.bad { background: var(--color-refuse); }
.tl .t { font-family: var(--font-mono); font-size: var(--size-1); color: var(--color-ink-3); }
.tl .r { font-family: var(--font-mono); font-size: var(--size-1); color: var(--color-ink-3); white-space: nowrap; }
.steps { list-style: none; margin: 0; padding: 0; }
.steps li { display: grid; grid-template-columns: 24px 40px 72px minmax(0, 1fr); gap: var(--space-3); padding: var(--space-2) 0; border-top: 1px solid var(--color-rule); }
.steps li:first-child { border-top: 0; }
.steps .ic { font-family: var(--font-mono); } .steps .ic.done { color: var(--color-ok); } .steps .ic.failed { color: var(--color-refuse); } .steps .ic.replanned { color: var(--color-hold); } .steps .ic.skipped { color: var(--color-ink-3); }
.steps .id { font-family: var(--font-mono); font-size: var(--size-1); color: var(--color-ink-3); } .steps .kind { font-size: var(--size-1); color: var(--color-ink-3); }
.steps .title { color: var(--color-ink); font-weight: 500; } .steps .detail { font-size: var(--size-2); color: var(--color-ink-3); }
.footnote { font-size: var(--size-2); color: var(--color-ink-3); margin-top: var(--space-4); }
/* timestamps: human time first, the artifact's ISO value second */
.t-lead { font-family: var(--font-body); font-weight: 500; color: var(--color-ink); white-space: nowrap; }
.t-lead + .footnote { display: inline; margin: 0; font: 400 var(--size-1)/1.5 var(--font-mono); }
/* the thesis line above the hero receipt */
.thesis { font: 600 var(--size-4)/1.3 var(--font-display); letter-spacing: -0.02em; color: var(--color-ink); max-width: none; text-wrap: balance; }
.state-note { border: 1px dashed var(--color-rule-2); border-radius: var(--radius-2); padding: var(--space-5); color: var(--color-ink-2); }
/* raw artifact: the judge's own affordance in every frame, so no state is inert */
details.raw { margin-top: var(--space-4); border-top: 1px solid var(--color-rule); padding-top: var(--space-2); }
details.raw summary { cursor: pointer; font: 500 var(--size-2)/1.4 var(--font-body); color: var(--color-ink-2); min-height: 32px; display: list-item; list-style: disclosure-closed inside; padding: var(--space-1) 0; transition: color var(--motion); text-decoration: underline; text-decoration-color: var(--color-rule-2); text-underline-offset: 4px; }
details.raw summary::marker { color: var(--color-accent); }
details.raw[open] summary { list-style: disclosure-open inside; }
details.raw summary:hover { color: var(--color-ink); text-decoration-color: var(--color-accent); }
details.raw pre { margin: var(--space-2) 0 0; padding: var(--space-3); background: var(--color-paper-2); border: 1px solid var(--color-rule); border-radius: var(--radius-1); font: 400 var(--size-1)/1.5 var(--font-mono); color: var(--color-ink-2); overflow: auto; max-height: 40vh; }
footer { border-top: 1px solid var(--color-rule); padding: var(--space-4) var(--space-5); font: 400 var(--size-2)/1.4 var(--font-body); color: var(--color-ink-3); display: flex; gap: var(--space-4); flex-wrap: wrap; }
/* ⌘K palette: the frame switcher */
.palette { position: fixed; inset: 0; z-index: 10; display: none; align-items: flex-start; justify-content: center; padding-top: 12vh; background: oklch(10% 0.01 260 / 0.5); }
.palette[open] { display: flex; }
.palette .box { width: min(560px, calc(100vw - 32px)); background: var(--color-paper); border: 1px solid var(--color-rule-2); border-radius: var(--radius-2); box-shadow: 0 1px 2px oklch(24% 0.02 258 / 0.08); overflow: hidden; }
.palette input { width: 100%; border: 0; border-bottom: 1px solid var(--color-rule); background: transparent; color: var(--color-ink); font: 400 var(--size-3)/1 var(--font-mono); padding: var(--space-4); min-height: 48px; }
.palette input:focus-visible { outline-offset: -2px; border-radius: 0; }
.palette ul { list-style: none; margin: 0; padding: var(--space-2); max-height: 50vh; overflow: auto; }
.palette li button { width: 100%; text-align: left; display: flex; justify-content: space-between; gap: var(--space-3); align-items: center; padding: var(--space-2) var(--space-3); border: 0; border-radius: var(--radius-1); background: transparent; color: var(--color-ink-2); font: 400 var(--size-2)/1.2 var(--font-body); cursor: pointer; min-height: 40px; }
.palette li button:hover, .palette li button[aria-selected="true"] { background: var(--color-paper-2); color: var(--color-ink); }
.palette li button kbd { font: 500 var(--size-1)/1 var(--font-mono); color: var(--color-ink-3); }
@media (max-width: 900px) { .span-3, .span-4, .span-5, .span-7, .span-8 { grid-column: span 12; } .head { grid-template-columns: minmax(0, 1fr); } .tl li { grid-template-columns: 14px 72px minmax(0, 1fr); } .tl .r { grid-column: 3; white-space: normal; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; } }
</style>
</head>
<body>
<nav class="nav" aria-label="Frames">
  <a class="wordmark" href="#refused"><i aria-hidden="true"></i>Veto</a>
  <div class="frames" id="frames"></div>
  <div class="right">
    <button class="kbd-btn" id="theme" type="button" aria-label="Switch colour scheme">dark</button>
    <button class="kbd-btn" id="cmdk" type="button" aria-label="Open the frame palette">⌘K</button>
  </div>
</nav>
<main id="main"></main>
<footer><span>read-only · the console triggers nothing</span><span id="built" class="mono"></span><span>the gate contains no model</span></footer>
<div class="palette" id="palette" role="dialog" aria-modal="true" aria-label="Jump to a frame">
  <div class="box"><input id="pal-q" type="search" placeholder="jump to a frame…" aria-label="Filter frames" autocomplete="off"><ul id="pal-list"></ul></div>
</div>
<script id="veto-data" type="application/json">/*__DATA__*/</script>
<script>
(() => {
  const D = JSON.parse(document.getElementById('veto-data').textContent);
  const esc = (s) => String(s ?? '').replace(/ — /g, ' · ').replace(/ – /g, ' · ').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const raw = (label, obj) => `<details class="raw"><summary>${esc(label)}</summary><pre>${esc(JSON.stringify(obj, null, 2))}</pre></details>`;
  const clean = (s) => String(s ?? '').replace(/\\/g, '');
  const hh = (iso) => (iso || '').slice(11, 19);
  // human time first, ISO second: the lead is for reading, the ISO is the artifact's own value
  const tLead = (iso) => new Date(iso).toLocaleString('en-US', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit', hourCycle: 'h23', timeZone: 'UTC' }) + ' UTC';
  const fmtTime = (iso) => iso ? `<span class="t-lead">${esc(tLead(iso))}</span> <span class="footnote">${esc(iso)}</span>` : 'n/a';
  const fmtWindow = (from, to) => from && to ? `<span class="t-lead">${esc(tLead(from))}${tLead(to) !== tLead(from) ? ' → ' + esc(tLead(to)) : ''}</span> <span class="footnote">${esc(from)} → ${esc(to)}</span>` : 'n/a';
  // percentage change of a numeric drifted fact, from its own old/new values; empty when the field is not a number
  const pct = (df) => { const a = parseFloat(df.old_value), b = parseFloat(df.new_value); return isFinite(a) && isFinite(b) && a ? (b >= a ? '+' : '-') + Math.abs(Math.round((b / a - 1) * 100)) + '%' : ''; };
  const valueOf = (f) => clean(f.includes(' is ') ? f.split(' is ').slice(1).join(' is ') : f);
  const fieldOf = (f) => f.split(' of ')[0];
  const short = (pins, url) => { const t = pins.find((p) => p.source_url === url && fieldOf(p.fact_text) === 'title'); return t ? valueOf(t.fact_text).replace(/,/g, ' ').split(/\s+/).slice(0, 3).join(' ') : url; };
  const line = (ev, key) => (ev.find((l) => l.startsWith(key)) || '').split(':').slice(1).join(':').trim();
  const session = (ev) => ((ev.find((l) => l.includes('(session ')) || '').split('(session ')[1] || 'n/a').replace(')', '');
  const pill = (cls, text) => `<span class="pill ${cls}"><i aria-hidden="true"></i>${esc(text)}</span>`;
  const head = (title, sub, env, gate) => `<div class="head"><div><h1>${esc(title)}</h1><p class="footnote" style="margin-top:8px">${esc(sub)}</p></div><div class="pills">${pill(env === 'mock' ? 'mock' : 'live', env === 'mock' ? 'MOCK · fixtures' : 'LIVE · amazon.com · US/EN')}${pill('gate ' + gate.toLowerCase(), gate)}</div></div>`;
  const metric = (label, n, sub, cls = '') => `<div class="card metric span-3"><div class="eyebrow">${esc(label)}</div><div class="n ${cls}">${esc(n)}</div><div class="sub">${esc(sub)}</div></div>`;
  const L = D.live, M = D.mock, P = D.plan;
  const ev = L.evidence, sess = session(ev);
  const ns = line(ev, 'north star').split(' · '), ct = line(ev, 'counter').split(' · ');
  // night-1 basis: night 1's ship (the ships.jsonl row that is not re-based); night-2 basis: the re-based ship (not a receipt)
  const b1 = new Set((L.ships?.find((s) => !s.rebased) || L.receipts[0] || {}).pin_hashes || []), b2 = new Set((P?.ships.find((s) => s.rebased) || L.ships?.at(-1) || {}).pin_hashes || []);
  const inj = (L.runs.find((r) => r.injected) || {}).injected || null;
  let derived = false, injD = inj;
  if (!injD) for (const df of ((L.receipts.at(-1) || {}).drifted_facts || [])) { const r = parseFloat(df.new_value) / parseFloat(df.old_value); if (df.field === 'price' && Math.abs(r - 0.85) < 0.002) { injD = { url: df.source_url, field: 'price' }; derived = true; } }
  const isInj = (df) => injD && df.source_url === injD.url && df.field === injD.field;
  const F = {};
  // 1 · VERIFYING: the traced MCP session
  F.verifying = () => {
    const tr = L.trace; if (!tr.length) return '<div class="state-note">No mcp-trace.jsonl in this evidence folder.</div>';
    const firstList = tr.findIndex((r) => r.method === 'tools/list');
    const calls = tr.slice(firstList + 1).filter((r) => r.method === 'tools/call' && r.tool === 'nimble_extract').slice(0, 5);
    const rows = tr.slice(0, firstList + 1).concat(calls);
    const ms = calls.map((r) => r.ms);
    return head('Overview', `session ${sess} · night 1 · the 18:00 fetch as traced in ${L.dir}/mcp-trace.jsonl`, 'live', 'VERIFYING')

  const themeBtn = document.getElementById('theme');
  const setTheme = (t) => { document.documentElement.setAttribute('data-theme', t); themeBtn.textContent = t; try { localStorage.setItem('veto-theme', t); } catch (e) {} };
  try { const t = localStorage.getItem('veto-theme'); if (t) setTheme(t); } catch (e) {}
  themeBtn.addEventListener('click', () => setTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'));
  // ⌘K palette: the frame switcher
  const pal = document.getElementById('palette'), q = document.getElementById('pal-q'), list = document.getElementById('pal-list');
  let sel = 0, last = null;
  const items = () => FRAMES.filter(([id, label]) => (label + ' ' + id).toLowerCase().includes(q.value.toLowerCase()));
  const render = () => { const it = items(); sel = Math.min(sel, Math.max(0, it.length - 1)); list.innerHTML = it.map(([id, label], i) => `<li><button type="button" role="option" aria-selected="${i === sel}" data-go="${id}"><span>${label}</span><kbd>#${id}</kbd></button></li>`).join('') || '<li><button type="button" disabled>no frame matches</button></li>'; };
  const open = () => { last = document.activeElement; pal.setAttribute('open', ''); q.value = ''; sel = 0; render(); q.focus(); };
  const close = () => { pal.removeAttribute('open'); if (last && last.focus) last.focus(); };
  document.getElementById('cmdk').addEventListener('click', open);
  pal.addEventListener('click', (e) => { if (e.target === pal) close(); const b = e.target.closest('[data-go]'); if (b) { location.hash = b.dataset.go; close(); } });
  q.addEventListener('input', () => { sel = 0; render(); });
  addEventListener('keydown', (e) => {
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); pal.hasAttribute('open') ? close() : open(); return; }
    if (!pal.hasAttribute('open')) return;
    if (e.key === 'Escape') close();
    else if (e.key === 'ArrowDown') { e.preventDefault(); sel = Math.min(items().length - 1, sel + 1); render(); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); sel = Math.max(0, sel - 1); render(); }
    else if (e.key === 'Enter') { const it = items()[sel]; if (it) { location.hash = it[0]; close(); } }
  });
})();
</script>
</body>
</html>
