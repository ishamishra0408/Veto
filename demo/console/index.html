  --color-refuse-soft: oklch(48% 0.19 27 / 0.12);
  --color-ok: oklch(46% 0.15 150);
  --color-ok-soft: oklch(46% 0.15 150 / 0.14);
  --color-hold: oklch(52% 0.16 70);
  --color-hold-soft: oklch(52% 0.16 70 / 0.16);
  --color-focus: oklch(50% 0.20 256);
  --size-1: 0.75rem; --size-2: 0.875rem; --size-3: 1rem; --size-4: 1.25rem; --size-5: 1.75rem; --size-6: 2.5rem;
  --space-1: 8px; --space-2: 8px; --space-3: 16px; --space-4: 16px; --space-5: 24px; --space-6: 32px; --space-7: 48px;
  --radius-1: 6px; --radius-2: 10px;
  --motion: 160ms cubic-bezier(0.16, 1, 0.3, 1);
  color-scheme: light;
}
:root[data-theme="dark"], :root:not([data-theme="light"]) {
  --color-paper: #0E0D0B;
  --color-paper-2: oklch(23% 0.018 260);
  --color-ink: #FFFFFF;
  --color-ink-2: #A5A49E;
  --color-ink-3: oklch(68% 0.012 252);
  --color-rule: rgb(255 255 255 / 0.10);

  --color-accent: #EDC602;

  --color-ok-soft: oklch(76% 0.16 150 / 0.16);

}

.pill.live { color: var(--color-ok); }

.card.graphite { background: var(--color-paper-2); }
.span-3 { grid-column: span 3; } .span-4 { grid-column: span 4; } .span-5 { grid-column: span 5; } .span-7 { grid-column: span 7; } .span-8 { grid-column: span 8; } .span-12 { grid-column: span 12; }
.metric .n { font: 600 var(--size-6)/1 var(--font-display); letter-spacing: -0.03em; color: var(--color-ink); margin: var(--space-2) 0; }
.metric .n.accent { color: var(--color-accent); } .metric .n.ok { color: var(--color-ok); } .metric .n.refuse { color: var(--color-refuse); }

.dl { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: var(--space-1) var(--space-4); font-family: var(--font-mono); font-size: var(--size-1); }
.dl dt { color: var(--color-ink-3); } .dl dd { margin: 0; color: var(--color-ink-2); overflow-wrap: anywhere; }

<script>

  const fmtTime = (iso) => iso ? `<span class="t-lead">${esc(tLead(iso))}</span> <span class="footnote">${esc(iso)}</span>` : 'n/a';
  const fmtWindow = (from, to) => from && to ? `<span class="t-lead">${esc(tLead(from))}${tLead(to) !== tLead(from) ? ' → ' + esc(tLead(to)) : ''}</span> <span class="footnote">${esc(from)} → ${esc(to)}</span>` : 'n/a';
  // percentage change of a numeric drifted fact, from its own old/new values; empty when the field is not a number
  const pct = (df) => { const a = parseFloat(df.old_value), b = parseFloat(df.new_value); return isFinite(a) && isFinite(b) && a ? (b >= a ? '+' : '-') + Math.abs(Math.round((b / a - 1) * 100)) + '%' : ''; };

      <div class="card span-12" style="padding:0 var(--space-3)"><table><thead><tr><th>Product</th><th>Field</th><th>Value</th><th>Pin</th><th>Basis</th><th>Fetched</th></tr></thead><tbody>${pins.map((p) => { const [b, cls] = basis(p); return `<tr class="${cls}"><td>${esc(short(L.pins, p.source_url))}</td><td style="color:var(--color-ink-3)">${esc(fieldOf(p.fact_text))}</td><td>${esc(valueOf(p.fact_text))}</td><td class="mono">${esc(p.pin_id)}</td><td style="color:${cls ? 'var(--color-hold)' : 'inherit'}">${esc(b)}</td><td class="mono">${fmtTime(p.fetched_at)}</td></tr>`; }).join('')}</tbody></table></div></div>`;
  };
  // 3 · REFUSED: the thesis line, the receipt as the hero, the refused draft; the split from the run row or derived and labelled
  const receiptCard = (title, r, cls = 'span-8') => `<div class="card ${cls}"><h2>${esc(title)}</h2><p style="margin-top:8px">${pill('gate refused', 'REFUSED')} <span class="mono" style="font-size:var(--size-1);color:var(--color-ink-3)">reason ${esc(r.reason)}</span></p>
    ${r.drifted_facts.map((df) => `<div class="fact"><div><div style="font-weight:500;color:var(--color-ink)">${esc(short(L.pins, df.source_url))} · ${esc(df.field)}</div><div><span class="was">was ${esc(clean(df.old_value))}</span> &nbsp; <span class="now">now ${esc(clean(df.new_value))}</span> <span class="code">pin ${esc(df.pin_id)} → ${esc(df.new_hash.slice(0, 12))}</span></div></div><span class="tag ${isInj(df) ? 'injected' : 'unforced'}">${isInj(df) ? 'injected' + (pct(df) ? ' · ' + pct(df) : '') : 'unforced · the real page changed'}</span></div>`).join('')}
    ${r.explanation ? `<div class="why"><div class="eyebrow" style="margin-bottom:6px">why, built from this receipt</div>${r.explanation.map((e) => `<div>${esc(clean(e))}</div>`).join('')}</div>` : ''}

  F.refused = () => {

    const draftLine = (l) => l.startsWith('|') ? `<p class="mono" style="font-size:var(--size-1);color:var(--color-ink-2);max-width:none">| ${l.split('|').map((c) => c.trim()).filter(Boolean).map(cell).join(' | ')} |</p>` : `<p class="footnote" style="margin-top:8px">${esc(l)}</p>`;
    const srcs = [dr.length && L.draft_file, imp && P.plan_file].filter(Boolean);
    const draftCard = dr.length || imp ? `<div class="card span-8"><h2>The draft that was refused</h2>${dr.length ? `<div style="margin-top:16px">${dr.map(draftLine).join('')}</div>` : ''}${imp ? `<p style="margin-top:16px;font:600 var(--size-4)/1.2 var(--font-display);color:var(--color-refuse)">${imp.affected.length} of ${imp.affected.length + imp.unaffected} conclusions broke</p><ul style="margin:8px 0 0;padding:0;list-style:none;font-size:var(--size-2)">${imp.affected.map((a) => `<li><span class="was">${esc(a.label)}</span></li>`).join('')}</ul><p class="footnote" style="margin-top:8px">${imp.unaffected} still hold</p>` : ''}<p class="footnote">from ${esc(srcs.join(' and '))}; the draft itself was never written (report.md not written)</p></div>` : '';
    return head('Receipts', 'every refusal ships with its evidence. Verify it; do not trust it.', 'live', 'REFUSED')
      + `<div class="grid">${thesis}${receiptCard(titles[0], rc[0], 'span-12')}${draftCard}
      <div class="card graphite span-4"><h2>Evidence</h2><dl class="dl" style="margin-top:16px;grid-template-columns:3ch minmax(0,1fr);font-size:var(--size-2)">${ns.concat(ct).map((it) => { const [n, ...l] = it.split(' '); const lab = l.join(' '); return `<dt style="font:600 var(--size-4)/1.2 var(--font-display);color:${/contradictions|false/.test(lab) ? 'var(--color-ok)' : 'var(--color-ink)'}">${esc(n)}</dt><dd style="align-self:center">${esc(lab)}${denom(lab) ? ' · ' + esc(denom(lab)) : ''}</dd>`; }).join('')}</dl><p class="footnote" style="color:${/matches/.test(line(ev, 'evidence source')) ? 'var(--color-ok)' : 'var(--color-hold)'}">source: ${esc(line(ev, 'evidence source'))}</p>
      <h3 style="margin-top:24px">Drift split</h3><p style="font:600 var(--size-4)/1.2 var(--font-display);color:var(--color-ink);margin-top:8px">${unf} unforced · ${all.length - unf} injected · of ${all.length} drifted fact${all.length === 1 ? '' : 's'}</p><p class="footnote" style="color:${derived ? 'var(--color-hold)' : 'inherit'}">${derived ? 'derived: the price drift at exactly ×0.85; this run predates the run row\'s injected field' : 'from the run row\'s injected field'}</p></div>
      ${rc[1] ? receiptCard(titles[1], rc[1], 'span-12') : ''}
      <div class="card ${draftCard ? 'span-12' : 'span-8'}"><h2>How a judge verifies this</h2><ol style="margin:16px 0 0 16px;padding:0;font-size:var(--size-2)"><li>recompute sha256 over each pin's canonical fact_text</li><li>compare against the stored hash; a mismatch refuses</li><li>every citation in the report resolves, or the ship aborts</li></ol><p class="footnote">The gate contains no model. The model proposes. The gate disposes.</p></div></div>`;
  };
  // 4 · RE-BASED: the plan, its impact, the ship receipt
  F.rebased = () => {
    if (!P || !P.plan) return '<div class="state-note">No plan.json in this build. Pass --plan <run folder> to build.mjs.</div>';
    const pl = P.plan, env = (P.runs.at(-1) || {}).adapter === 'mock' ? 'mock' : 'live', sh = P.ships.filter((s) => s.rebased).at(-1), imp = pl.impact || { affected: [], unaffected: 0, drifted_pins: [] }, rec = pl.recommendation || {};
    // one [was-pin:old] → [pin:new] per drifted fact of the last receipt; the new pin is what the shipped report discloses when it names one, else the receipt's new_hash
    const disc = P.disclosed || [], pairs = ((P.receipts.at(-1) || {}).drifted_facts || []).map((df) => ({ was: df.pin_id, pin: (disc.find((d) => d.was === df.pin_id) || {}).pin || df.new_hash.slice(0, 12) }));
    // the planner writes the [was-pin:] marker without ids; fill them from the receipt and say so, the step detail is otherwise verbatim
    const detailOf = (s) => { const d = s.detail || ''; if (!/\[was-pin:\]/.test(d) || !pairs.length) return esc(d);
      const ids = pairs.map((p) => `[was-pin:${p.was}] → [pin:${p.pin}]`).join(', ');
      return `<span title="pin ids filled from the receipt; the planner wrote the marker without them">${esc(d.replace('[was-pin:]', ids))}</span>`; };
    const contra = P.runs.reduce((a, r) => a + (r.contradiction || 0), 0);
    const ic = { done: '✓', replanned: '↻', failed: '✗', skipped: '-', pending: '·' };
    return head('Plan', `night 2 · the plan is a dependency graph from conclusions to pins · ${env} run · ${esc(P.dir)}`, env, sh ? 'RE-BASED' : 'REFUSED')
      + `<div class="grid"><div class="card span-7"><div class="eyebrow">goal</div><p style="margin-top:8px;color:var(--color-ink)">${esc(pl.goal)}</p><ol class="steps" style="margin-top:16px">${pl.steps.map((s) => `<li><span class="ic ${esc(s.status)}" aria-label="${esc(s.status)}">${ic[s.status] || '·'}</span><span class="id">${esc(s.id)}</span><span class="kind">${esc(s.kind)}</span><span><div class="title">${esc(s.title)}</div><div class="detail">${detailOf(s)}</div></span></li>`).join('')}</ol></div>
      <div class="span-5" style="display:grid;gap:var(--space-4);min-width:0"><div class="card"><h2>Impact analysis</h2><p style="font:600 var(--size-4)/1.2 var(--font-display);color:var(--color-refuse);margin-top:8px">drift breaks ${imp.affected.length} of ${imp.affected.length + imp.unaffected} conclusions</p><ul style="margin:8px 0 0;padding:0;list-style:none;font-size:var(--size-2)">${imp.affected.map((a) => `<li>✗ ${esc(a.label)}</li>`).join('')}</ul><p class="footnote">${imp.unaffected} still hold · drifted pins: ${esc(imp.drifted_pins.join(', '))}</p></div>
      <div class="card"><h2>Recommended price</h2><p style="margin-top:8px;font:600 var(--size-5)/1.1 var(--font-display)"><span style="color:var(--color-ink-3)">${rec.before != null ? '$' + rec.before.toFixed(2) : 'n/a'}</span> <span aria-hidden="true" style="color:var(--color-ink-3)">→</span> <span style="color:var(--color-ok)">${rec.after != null ? '$' + rec.after.toFixed(2) : 'n/a'}</span></p><p class="footnote">recomputed from re-pinned facts${pairs.length ? '; disclosed in the shipped report as ' + pairs.map((p) => `<span class="code">[was-pin:${esc(p.was)}] → [pin:${esc(p.pin)}]</span>`).join('<br>') : ''}</p></div>
      <div class="card graphite"><h2>Ship receipt · re-based</h2>${sh ? `<p style="margin-top:8px">${pill('gate clean', 'CLEAN')}</p><dl class="dl" style="margin-top:16px"><dt>shipped_at</dt><dd>${fmtTime(sh.shipped_at)}</dd><dt>rebased</dt><dd>true</dd><dt>pin_hashes</dt><dd>${sh.pin_hashes.length} revalidated</dd><dt>basis</dt><dd>${fmtWindow(sh.basis_window?.from, sh.basis_window?.to)}</dd>${P.receipts.length ? `<dt>refused_at</dt><dd>${fmtTime(P.receipts.at(-1).refused_at)}</dd>` : ''}</dl><p class="footnote">refused first, then re-pinned, recomputed, disclosed, re-gated, shipped. <span style="color:${contra ? 'var(--color-refuse)' : 'var(--color-ok)'}">${contra} of ${P.ships.length} shipped report${P.ships.length === 1 ? '' : 's'} contradicted${contra ? '' : ': the refused draft never left'}.</span></p>${raw('raw: ships.jsonl, the re-based row', sh)}` : '<p class="footnote">no re-based ship in this run</p>'}${raw('raw: plan.json', pl)}</div></div></div>`;
  };
  // 5 · UNREACHABLE: mock, fail closed
  F.unreachable = () => {
    const r = M.receipts.filter((x) => x.reason === 'UNREACHABLE').at(-1); if (!r) return '<div class="state-note">No UNREACHABLE receipt in the mock run.</div>';
    return head('Receipt · REFUSED (unreachable)', `fail-closed, not fail-open · ${M.dir} · R5`, 'mock', 'REFUSED')
      + `<div class="grid"><div class="card span-8"><h2>Refusal receipt</h2><p style="margin-top:8px">${pill('gate refused', 'REFUSED')} <span class="mono" style="font-size:var(--size-1);color:var(--color-ink-3)">reason ${esc(r.reason)}</span></p><dl class="dl" style="margin-top:16px"><dt>refused_at</dt><dd>${fmtTime(r.refused_at)}</dd><dt>error</dt><dd>${esc(r.error)}</dd><dt>drifted_facts</dt><dd>[] · nothing to compare</dd><dt>pin_hashes</dt><dd>${r.pin_hashes.length} carried</dd>${r.basis_window ? `<dt>basis_window</dt><dd>${fmtWindow(r.basis_window.from, r.basis_window.to)}</dd>` : ''}${M.r5.slice(0, 2).map((l) => `<dt>${esc(l.split(':')[0].replace('R5 report.md ', ''))}</dt><dd style="color:var(--color-ok)">${esc(l.split(':').slice(1).join(':').trim())}</dd>`).join('')}</dl>${M.r5.length ? '<p class="footnote">before = after: report.md untouched (sha256-mtime)</p>' : ''}${raw('raw: this receipt, verbatim', r)}</div>
      <div class="card graphite span-4"><h2>Fail-closed, not fail-open</h2><ul style="margin:16px 0 0 16px;padding:0;font-size:var(--size-2)"><li>no pins → no report, ever</li><li>no silent fallback to yesterday's values</li><li>the receipt is the audit trail</li></ul><p class="footnote">a live Nimble failure reads: fetch failed for &lt;url&gt;: MCP tools/call → HTTP &lt;code&gt; (veto/adapters.ts, gate.ts)</p></div></div>`;
  };
  // 6 · CLEAN: mock ship receipt
  F.clean = () => {
    const s = M.ships[0]; if (!s) return '<div class="state-note">No ships.jsonl in the mock run.</div>';
    const cleanRuns = M.runs.filter((r) => r.verdict === 'CLEAN').length, resolved = M.verify.find((l) => l.includes('resolved')) || 'not verified';
    // the zeros and their denominators: drift from this ship's run row (checks[].drifted) over its pin_hashes; false refusals from runs.jsonl over receipts.jsonl
    const run0 = M.runs.find((r) => r.run_at === s.shipped_at) || M.runs.find((r) => r.verdict === 'CLEAN') || {}, moved = (run0.checks || []).filter((c) => c.drifted).length, fr = M.runs.reduce((a, r) => a + (r.false_refusal || 0), 0);
    return head('Receipt · CLEAN (mock)', `the counter the villain night can't show · deterministic fixtures · ${M.dir}`, 'mock', 'CLEAN')
      + `<div class="grid">${metric('Facts pinned', s.pin_hashes.length, 'all revalidated')}${metric('Drift flagged', `${moved} of ${s.pin_hashes.length}`, 'pins moved · the run row\'s checks')}${metric('Clean runs shipped', cleanRuns, 'runs.jsonl · verdict CLEAN', 'ok')}${metric('False refusals', `${fr} of ${M.receipts.length}`, 'refusals were false · runs.jsonl false_refusal', 'ok')}
      <div class="card span-8"><h2>Ship receipt</h2><p style="margin-top:8px">${pill('gate clean', 'CLEAN')}</p><dl class="dl" style="margin-top:16px"><dt>shipped_at</dt><dd>${fmtTime(s.shipped_at)}</dd><dt>rebased</dt><dd>${String(!!s.rebased)}</dd><dt>pin_hashes</dt><dd>${s.pin_hashes.length} revalidated</dd><dt>basis</dt><dd>${fmtWindow(s.basis_window?.from, s.basis_window?.to)}</dd><dt>verify_pins</dt><dd style="color:var(--color-ok)">${esc(resolved)}</dd></dl><p class="footnote">report.md is written by the gated ship step only (G1); report.ts writes a draft.</p>${raw('raw: ships.jsonl, first row', s)}</div></div>`;
  };
  // 7 · RUNS: writer and gate latency per run
  F.runs = () => {
    if (!L.runs.length) return '<div class="state-note">No runs.jsonl in this evidence folder.</div>';
    const last = L.runs.at(-1).verdict === 'CLEAN' ? 'CLEAN' : 'REFUSED';
    const w = (r) => (r.agent || 'none').replace('hf.co/LiquidAI/', '').replace('-GGUF:Q4_K_M', ' · on-device');
    return head('Runs', `session ${sess} · one row per night · the writer and the gate's latency, per run`, 'live', last)
      + `<div class="grid"><div class="card span-12" style="padding:0 var(--space-3)"><table><thead><tr><th>Run</th><th>Mode</th><th>Verdict</th><th>Writer</th><th>Claims</th><th>Gate</th><th>Adapter</th></tr></thead><tbody>${L.runs.map((r) => `<tr><td class="mono">${fmtTime(r.run_at)}</td><td>${esc(r.mode || '')}</td><td style="color:${r.verdict === 'CLEAN' ? 'var(--color-ok)' : 'var(--color-refuse)'}">${esc(r.verdict)}${r.reason && r.reason !== r.verdict ? ' · ' + esc(r.reason) : ''}${r.rebased ? ' · re-based' : ''}</td><td style="color:${r.agent === 'template' ? 'var(--color-hold)' : 'inherit'}">${esc(w(r))}</td><td style="color:var(--color-ink-3)">${esc(r.claims_kept ?? 'n/a')} kept · ${esc(r.claims_dropped ?? 'n/a')} dropped</td><td class="mono">${esc(r.gate_ms ?? 'n/a')} ms</td><td style="color:var(--color-ink-3)">${esc(r.adapter || '')}</td></tr>`).join('')}</tbody></table></div>
      <div class="card graphite span-12"><h2>Evidence source and guardrail, this session</h2><dl class="dl" style="margin-top:16px">${['evidence source', 'guardrail', 'live', 'volatility'].filter((k) => line(ev, k)).map((k) => `<dt>${esc(k)}</dt><dd style="color:${k === 'evidence source' && /matches/.test(line(ev, k)) ? 'var(--color-ok)' : 'inherit'}">${esc(line(ev, k))}</dd>`).join('')}</dl><p class="footnote">fallbacks, when they fire: writer → deterministic template (agent.ts); counts → local files (evidence.ts). Neither touches the gate.</p>${raw('raw: runs.jsonl', L.runs)}</div></div>`;
  };
  const FRAMES = [['verifying', 'Overview'], ['pins', 'Pins'], ['refused', 'Receipts'], ['rebased', 'Plan'], ['unreachable', 'Unreachable'], ['clean', 'Clean'], ['runs', 'Runs']];
  const main = document.getElementById('main');
  main.innerHTML = FRAMES.map(([id]) => `<section data-state="${id}" hidden>${F[id]()}</section>`).join('')
    + '<section data-state="loading" hidden><div class="state-note" role="status">Loading evidence… <a href="#refused">open the last built frame</a></div></section>'
    + '<section data-state="empty" hidden><div class="state-note">No evidence folder found. Run <span class="mono">bash veto/demo.sh</span>, then <span class="mono">node demo/console/build.mjs</span>. <a href="#refused">back to receipts</a></div></section>'
    + '<section data-state="error" hidden><div class="state-note" role="alert">An artifact could not be parsed. The console shows nothing rather than a guess. <a href="#refused">back to receipts</a></div></section>';
  document.getElementById('frames').innerHTML = FRAMES.map(([id, label]) => `<a href="#${id}" data-frame="${id}">${label}</a>`).join('');
  document.getElementById('built').textContent = `built ${D.built_at.slice(0, 16).replace('T', ' ')}Z from ${D.live.dir}`;
  // hide() toggles the sections; mark() moves the nav and the title. The router calls both. The observer below calls mark()
  // for whichever section is visible, so a section unhidden from outside (the state matrix) moves the nav too; it never sets the hash.
  function hide(id) { document.querySelectorAll('[data-state]').forEach((el) => { el.hidden = el.getAttribute('data-state') !== id; }); }
  function mark(id) {
    document.querySelectorAll('[data-frame]').forEach((a) => { if (a.dataset.frame === id) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
    document.title = `Veto console · ${FRAMES.find((f) => f[0] === id)?.[1] || id}`;
  }
  function show(id) { if (!F[id]) id = 'refused'; hide(id); mark(id); }
  const route = () => show(location.hash.replace('#', '') || 'refused');
  addEventListener('hashchange', route); route();
  new MutationObserver(() => { const vis = [...main.querySelectorAll('[data-state]')].find((el) => !el.hidden); if (vis) mark(vis.getAttribute('data-state')); }).observe(main, { attributes: true, attributeFilter: ['hidden'], subtree: true });
  // theme
  const themeBtn = document.getElementById('theme');
  const setTheme = (t) => { document.documentElement.setAttribute('data-theme', t); themeBtn.textContent = t; try { localStorage.setItem('veto-theme', t); } catch (e) {} };
  try { const t = localStorage.getItem('veto-theme'); if (t) setTheme(t); } catch (e) {}
  themeBtn.addEventListener('click', () => setTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'));
  // ⌘K palette: the frame switcher
  const pal = document.getElementById('palette'), q = document.getElementById('pal-q'), list = document.getElementById('pal-list');
  let sel = 0, last = null;
  const items = () => FRAMES.filter(([id, label]) => (label + ' ' + id).toLowerCase().includes(q.value.toLowerCase()));
  const render = () => { const it = items(); sel = Math.min(sel, Math.max(0, it.length - 1)); list.innerHTML = it.map(([id, label], i) => `<li><button type="button" role="option" aria-selected="${i === sel}" data-go="${id}"><span>${label}</span><kbd>#${id}</kbd></button></li>`).join('') || '<li><button type="button" disabled>no frame matches</button></li>'; };
  const open = () => { last = document.activeElement; pal.setAttribute('open', ''); q.value = ''; sel = 0; render(); q.focus(); };
  const close = () => { pal.removeAttribute('open'); if (last && last.focus) last.focus(); };
  document.getElementById('cmdk').addEventListener('click', open);
  pal.addEventListener('click', (e) => { if (e.target === pal) close(); const b = e.target.closest('[data-go]'); if (b) { location.hash = b.dataset.go; close(); } });
  q.addEventListener('input', () => { sel = 0; render(); });
  addEventListener('keydown', (e) => {
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); pal.hasAttribute('open') ? close() : open(); return; }
    if (!pal.hasAttribute('open')) return;
    if (e.key === 'Escape') close();
    else if (e.key === 'ArrowDown') { e.preventDefault(); sel = Math.min(items().length - 1, sel + 1); render(); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); sel = Math.max(0, sel - 1); render(); }
    else if (e.key === 'Enter') { const it = items()[sel]; if (it) { location.hash = it[0]; close(); } }
  });
})();
</script>
</body>
